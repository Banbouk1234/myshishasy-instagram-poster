name: Renewal Reminders

on:
  schedule:
    - cron: '0 4 * * *'      # 08:00 Dubai time every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print emails instead of sending them'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cryptography
      - name: Send due reminders
        run: python renewals/reminders.py
        env:
          VAULT_PASSPHRASE:   ${{ secrets.VAULT_PASSPHRASE }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL:            ${{ vars.APP_URL }}
          DRY_RUN:            ${{ inputs.dry_run && '1' || '' }}
      - name: Save reminder state
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions Bot"
          git add renewals/data/reminders_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update reminder state [skip ci]"
          git push || true
